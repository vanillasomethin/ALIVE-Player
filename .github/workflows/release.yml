name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track (internal | alpha | beta | production)"
        required: true
        default: internal

jobs:
  # ── Job 1: debug APK → GitHub Release (always runs, no secrets needed) ──────
  sideload-apk:
    name: Build debug APK and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/alive-player-${{ github.run_number }}.apk

      - name: Create or update GitHub Release (sideload)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sideload-latest
          name: "ALIVE Player – Sideload APK (build ${{ github.run_number }})"
          body: |
            **Sideload URL for Downloader by AFTVnews:**
            Paste this URL into the Downloader app on your Android TV / Fire TV device.

            `https://github.com/${{ github.repository }}/releases/download/sideload-latest/alive-player-${{ github.run_number }}.apk`

            This is a debug build intended for testing before Play Store submission.
            Build: `${{ github.sha }}`
          files: app/build/outputs/apk/debug/alive-player-${{ github.run_number }}.apk
          prerelease: true

  # ── Job 2: signed AAB → Play Store (only runs when signing secrets exist) ───
  play-store:
    name: Build signed AAB and upload to Play Store
    runs-on: ubuntu-latest
    # Skip if signing secrets are not yet configured
    if: ${{ vars.PLAY_STORE_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_STORE_FILE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      - name: Decode Play service account key
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > ${{ github.workspace }}/play-service-account.json

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release AAB
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish to Play Store
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/play-service-account.json
        run: |
          ./gradlew publishReleaseBundle \
            -Pandroid.injected.signing.store.file=$SIGNING_STORE_FILE \
            -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD \
            --no-daemon

      - name: Clean up secrets
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.jks
          rm -f ${{ github.workspace }}/play-service-account.json
