name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track (internal | alpha | beta | production)"
        required: true
        default: internal

jobs:
  # ── Job 1: debug APK → GitHub Release (always runs, no secrets needed) ──────
  sideload-apk:
    name: Build debug APK and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Icons are generated at build time from the source artwork rather than committed
      # per density, so only the two source PNGs live in the repo. Runners ship
      # ImageMagick, so this needs no local tooling. Skipped when the artwork is absent,
      # which keeps the build green before it has been supplied.
      - name: Generate launcher icons and TV banner
        run: |
          if [ -f tools/branding/alive-player-banner.png ] && [ -f tools/branding/alive-player-icon.png ]; then
            chmod +x ./tools/generate-icons.sh
            ./tools/generate-icons.sh
          else
            echo "No branding artwork in tools/branding/ — keeping current icons."
            echo "Add alive-player-banner.png (16:9) and alive-player-icon.png (square);"
            echo "see tools/branding/README.md."
          fi

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/alive-player-${{ github.run_number }}.apk

      # OTA manifest published alongside the APK, so /api/device/update-check reads the
      # release itself instead of three hand-maintained Vercel env vars. Those had to be
      # updated by hand on every release; when they drifted the endpoint just answered
      # "no update" and OTA silently stopped working with nothing to notice.
      - name: Write OTA manifest
        run: |
          APK=app/build/outputs/apk/debug/alive-player-${{ github.run_number }}.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > app/build/outputs/apk/debug/latest.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/sideload-latest/alive-player-${{ github.run_number }}.apk",
            "sha256": "$SHA",
            "commit": "${{ github.sha }}"
          }
          JSON
          echo "OTA manifest:"; cat app/build/outputs/apk/debug/latest.json

      - name: Create or update GitHub Release (sideload)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sideload-latest
          name: "ALIVE Player – Sideload APK (build ${{ github.run_number }})"
          body: |
            **Sideload URL for Downloader by AFTVnews:**
            Paste this URL into the Downloader app on your Android TV / Fire TV device.

            `https://github.com/${{ github.repository }}/releases/download/sideload-latest/alive-player-${{ github.run_number }}.apk`

            Paired screens update themselves from this release via OTA — `latest.json`
            below is the manifest `/api/device/update-check` serves to them.
            Build: `${{ github.sha }}`
          files: |
            app/build/outputs/apk/debug/alive-player-${{ github.run_number }}.apk
            app/build/outputs/apk/debug/latest.json
          prerelease: true

  # ── Job 2: signed AAB — build + archive only. Play Store publishing is disabled;
  # updates ship OTA (see the OTA manifest step above). The AAB is still built every
  # release so a signed artifact is always ready if Play distribution is revived, and
  # so signing config breakage is caught here rather than at release time.
  play-store:
    name: Build signed AAB (archive only — Play publishing disabled)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_STORE_FILE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Same generation as the debug job, so both artifacts carry identical icons.
      - name: Generate launcher icons and TV banner
        run: |
          if [ -f tools/branding/alive-player-banner.png ] && [ -f tools/branding/alive-player-icon.png ]; then
            chmod +x ./tools/generate-icons.sh
            ./tools/generate-icons.sh
          else
            echo "No branding artwork in tools/branding/ — keeping current icons."
          fi

      - name: Build signed release AAB
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Play Store publishing intentionally removed — updates ship OTA. Re-enabling it
      # would also need the self-update code split out into a separate build flavour:
      # Play policy forbids an app distributed through Play from updating its own APK,
      # and this build carries REQUEST_INSTALL_PACKAGES + PackageInstaller for OTA.
      - name: Clean up secrets
        if: always()
        run: |
          rm -f ${{ github.workspace }}/release.jks
          rm -f ${{ github.workspace }}/play-service-account.json
